<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catboy Hanako</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  background: url('https://imgs.search.brave.com/420zKN74u08NVL3mgLjJvFINmpsA_VGTJkM2KAO24_U/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS50ZW5vci5jb20v/NEhYTHowNXE5dG9B/QUFBTS9nYXdyLWd1/cmEtYW5pbWUuZ2lm.gif') no-repeat center/cover;
  overflow: hidden;
}

.enter-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  cursor: pointer;
  transition: opacity 0.8s ease;
}

.enter-text {
  color: white;
  font-size: 22px;
  letter-spacing: 3px;
  opacity: 0.7;
  transition: 0.3s;
}

.enter-text:hover {
  opacity: 1;
  transform: scale(1.1);
}

.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.6);
}

.bg {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18vw;
  font-family: Georgia, serif;
  letter-spacing: 25px;
  color: rgba(160, 60, 255, 0.10);
  text-shadow: 0 0 25px rgba(170, 0, 255, 0.35),
               0 0 60px rgba(120, 0, 255, 0.45),
               0 0 120px rgba(40, 0, 80, 0.7);
  filter: contrast(140%) saturate(160%);
}

.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

.pfp {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin-bottom: 15px;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.25);
  box-shadow: 0 0 25px rgba(170, 0, 255, 0.25);
  transition: 0.3s;
}

.pfp:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(180, 0, 255, 0.5);
}

.name {
  font-size: 32px;
  margin-bottom: 6px;
}

.alias {
  font-size: 14px;
  opacity: 0.6;
  margin-bottom: 22px;
  min-height: 18px;
  color: rgba(140, 60, 255, 0.75);
}

.links a {
  display: block;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  margin: 7px 0;
  transition: 0.2s;
}

.links a:hover {
  color: white;
  transform: scale(1.05);
}

#bgMusic {
  display: none;
}
</style>
</head>

<body>

<div class="enter-screen" id="enterScreen">
  <div class="enter-text">CLICK TO ENTER</div>
</div>

<div class="overlay"></div>

<div class="bg">Cat</div>

<div class="card">
  <img src="https://i.pinimg.com/1200x/1a/98/60/1a98606430d8630b38c19a5d053a1c33.jpg" class="pfp">

  <div class="name">Hanako</div>
  <div class="alias" id="bio"></div>

  <div class="links">
    <a href="https://discord.gg/988" target="_blank">Discord</a>
    <a href="https://doxbin.com/malissa" target="_blank">Doxbin</a>
    <a href="https://zone15.xyz/" target="_blank">Dead</a>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://files.catbox.moe/fk8drg.mp3" type="audio/mpeg">
</audio>

<script>
const screen = document.getElementById("enterScreen");
const music = document.getElementById("bgMusic");

screen.addEventListener("click", () => {
  screen.style.opacity = "0";

  setTimeout(() => {
    screen.style.display = "none";
  }, 800);

  music.volume = 0.6;
  const playPromise = music.play();

  if (playPromise !== undefined) {
    playPromise.catch(err => {
      console.log("Autoplay blocked:", err);
    });
  }
});

const titleText = "Catboy Hanako";
let i = 0;

setInterval(() => {
  document.title = titleText.slice(0, i);
  i++;
  if (i > titleText.length) i = 0;
}, 200);

const bioText = "None of your business what im doin'.";
const bio = document.getElementById("bio");

let bi = 0;
let deleting = false;

function typeBio() {
  if (!deleting) {
    bio.textContent = bioText.slice(0, bi++);
    if (bi > bioText.length) {
      deleting = true;
      setTimeout(typeBio, 1200);
      return;
    }
  } else {
    bio.textContent = bioText.slice(0, bi--);
    if (bi < 0) {
      deleting = false;
      bi = 0;
    }
  }

  setTimeout(typeBio, deleting ? 40 : 70);
}

typeBio();
</script>

</body>
</html>
