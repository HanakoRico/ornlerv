<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝕹ear</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500&family=UnifrakturCook:wght@700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  background-image: url('https://media.tenor.com/8_BMKq0sjX4AAAAM/near-death-note.gif');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: black;
  overflow: hidden;
}

.enter-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  cursor: pointer;
  transition: opacity 0.8s ease;
}

.enter-text {
  color: white;
  font-size: 22px;
  letter-spacing: 3px;
  opacity: 0.7;
  transition: 0.3s;
}

.enter-text:hover {
  opacity: 1;
  transform: scale(1.1);
}

.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.5);
}

.bg {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 20vw;
  font-family: 'UnifrakturCook', cursive;
  letter-spacing: 10px;
  color: white;
  opacity: 0.6;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

.pfp {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin-bottom: 15px;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.25);
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
  transition: 0.3s;
}

.pfp:hover {
  transform: scale(1.1);
}

.name {
  font-size: 32px;
  margin-bottom: 6px;
}

.alias {
  font-size: 15px;
  color: black;
  margin-bottom: 22px;
  min-height: 18px;
  text-shadow: 0 1px 4px rgba(255,255,255,0.6);
}

.links a {
  display: block;
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  margin: 7px 0;
  transition: 0.2s;
}

.links a:hover {
  color: white;
  transform: scale(1.05);
}

#bgMusic {
  display: none;
}
</style>
</head>

<body>

<div class="enter-screen" id="enterScreen">
  <div class="enter-text">CLICK TO ENTER</div>
</div>

<div class="overlay"></div>

<div class="bg">Near</div>

<div class="card">
  <img src="https://i.pinimg.com/1200x/2b/c5/9d/2bc59dfc44d42409eb6e29251009e5f9.jpg" class="pfp">

  <div class="name">Near</div>
  <div class="alias" id="bio"></div>

  <div class="links">
    <a href="https://discord.gg/988" target="_blank">Discord</a>
    <a href="https://doxbin.com/user/malissa" target="_blank">Doxbin</a>
    <a href="https://zone15.xyz/" target="_blank">Dead</a>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://archive.org/download/death-note-ost-1/01.%20Death%20Note.mp3" type="audio/mpeg">
</audio>

<script>
const screen = document.getElementById("enterScreen");
const music = document.getElementById("bgMusic");

screen.addEventListener("click", () => {
  screen.style.opacity = "0";
  setTimeout(() => {
    screen.style.display = "none";
  }, 800);

  music.volume = 0.6;
  music.play().catch(() => {});
});

const titleText = "𝕹ear";
let i = 0;

setInterval(() => {
  document.title = titleText.slice(0, i);
  i++;
  if (i > titleText.length) i = 0;
}, 200);

const bioText = "Near the end of the game, it will all change, everything will flip.";
const bio = document.getElementById("bio");

let bi = 0;
let deleting = false;

function typeBio() {
  if (!deleting) {
    bio.textContent = bioText.slice(0, bi++);
    if (bi > bioText.length) {
      deleting = true;
      setTimeout(typeBio, 1200);
      return;
    }
  } else {
    bio.textContent = bioText.slice(0, bi--);
    if (bi < 0) {
      deleting = false;
      bi = 0;
    }
  }

  setTimeout(typeBio, deleting ? 40 : 70);
}

typeBio();
</script>

</body>
</html>
