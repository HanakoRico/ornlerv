<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRT Hanako</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  background: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzhxYWQ0d2dnYWZqeWtibGJxdXVtOXJlaW9nMDRqcDliYTAzcG1nYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/McKNBovGgoZCG5HBCK/giphy.gif') no-repeat center/cover;
  overflow: hidden;
}

/* CLICK SCREEN */
.enter-screen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  cursor: pointer;
  transition: opacity 0.8s ease;
}

.enter-text {
  color: white;
  font-size: 22px;
  letter-spacing: 3px;
  opacity: 0.7;
  transition: 0.3s;
}

.enter-text:hover {
  opacity: 1;
  transform: scale(1.1);
}
  
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.6);
}

.bg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 18vw;
  color: rgba(255,255,255,0.04);
  letter-spacing: 30px;
}

.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

.pfp {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin-bottom: 15px;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.25);
  box-shadow: 0 0 25px rgba(255,255,255,0.2);
  transition: 0.3s;
}

.pfp:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(255,255,255,0.4);
}

.name {
  font-size: 32px;
  margin-bottom: 6px;
}

.alias {
  font-size: 14px;
  opacity: 0.6;
  margin-bottom: 22px;
}

.links a {
  display: block;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  margin: 7px 0;
  transition: 0.2s;
}

.links a:hover {
  color: white;
  transform: scale(1.05);
}

#bgMusic {
  display: none;
}
</style>
</head>

<body>

<div class="enter-screen" id="enterScreen">
  <div class="enter-text">CLICK TO ENTER</div>
</div>

<div class="overlay"></div>
<div class="bg">SRT</div>

<div class="card">
  <img src="https://i.pinimg.com/736x/4d/d6/b4/4dd6b4b16261afaf996b8a41ed50854f.jpg" class="pfp">

  <div class="name">Hanako</div>
  <div class="alias">Countin' money what the fuck is a budget.</div>

  <div class="links">
    <a href="https://discord.gg/988" target="_blank">Discord</a>
    <a href="https://988ae.xyz" target="_blank">988</a>
    <a href="https://zone15.xyz" target="_blank">Dead</a>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://files.catbox.moe/fk8drg.mp3" type="audio/mpeg">
</audio>

<script>
const screen = document.getElementById("enterScreen");
const music = document.getElementById("bgMusic");

screen.addEventListener("click", () => {
  screen.style.opacity = "0";

  setTimeout(() => {
    screen.style.display = "none";
  }, 800);

  music.volume = 0.6;

  const playPromise = music.play();

  if (playPromise !== undefined) {
    playPromise.catch(err => {
      console.log("Autoplay blocked:", err);
    });
  }
});
</script>

</body>
</html>
